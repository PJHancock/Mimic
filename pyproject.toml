[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimic"
version = "0.1.0"
description = "Learning manipulation skills from human demonstration video"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Team Mimic", email = "team@mimic.local"},
]
keywords = ["robotics", "manipulation", "learning from demonstration", "video understanding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    # Computer Vision & Tracking
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    # Video Processing
    "moviepy>=1.0.0",
    "imageio>=2.31.0",
    "imageio-ffmpeg>=0.4.9",
    # Robotics & Simulation
    "mujoco>=3.0.0",
    # ML & Training
    "scikit-learn>=1.3.0",
    "tensorboard>=2.13.0",
    "tqdm>=4.66.0",
    "scipy>=1.10.0",  # For signal processing (trajectory smoothing)
    # Audio & Speech
    "openai-whisper>=20230314",
    # Configuration & Utilities
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pyctcdecode>=0.5.0",
    "torchaudio>=2.11.0",
]

[dependency-groups]
# Robot development is explicitly Python >=3.10; the base package retains 3.9 support.
robot = [
    "mink==1.3.0",
    "ruckig==0.19.4",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.4.0",
    "pre-commit>=3.3.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "nbstripout>=0.6.1",
]

docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/Mimic"
Documentation = "https://mimic.readthedocs.io"
Repository = "https://github.com/yourusername/Mimic.git"
Issues = "https://github.com/yourusername/Mimic/issues"

[project.scripts]
mimic-video-pipeline = "mimic.integration.run_video_pipeline:main"

[tool.uv.dependency-groups]
robot = {requires-python = ">=3.10"}

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/mimic"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if sys.version_info",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mimic"]
