# Default configuration for Mimic project
# Override specific values in experiment-specific configs

# Paths
data_dir: data
output_dir: outputs

# Video processing
fps: 30
video_extension: ".mp4"

# Caching
cache_embeddings: true
cache_tracks: true

# Compute
device: cuda  # or "cpu" for testing
random_seed: 42

# Temporal model
temporal_model:
  type: gru  # "gru", "transformer", "mlp"
  hidden_size: 256
  num_layers: 2
  dropout: 0.1
  learning_rate: 1.0e-3
  batch_size: 32
  num_epochs: 50
  val_split: 0.2

# Tracking
tracking:
  hand_confidence_threshold: 0.5
  object_confidence_threshold: 0.5
  use_mediapipe: true
  use_opencv_tracker: true
  use_sam2: false  # SAM2 is a stretch goal, not in MVP
  smooth_trajectories: true

  # Red Solo cup color detection (HSV range)
  # Red wraps around hue 0/180, so we use two ranges
  object_color_hsv_lower: [0, 100, 100]      # H, S, V lower bounds (red lower)
  object_color_hsv_upper: [10, 255, 255]     # H, S, V upper bounds (red lower)
  object_color_hsv_lower_wrap: [170, 100, 100]  # Red upper range (wrap around 180)
  object_color_hsv_upper_wrap: [180, 255, 255]
  min_contour_area: 500  # Minimum pixel area to consider valid cup detection

  # Trajectory processing
  num_trajectory_waypoints: 30
  savgol_filter_window: 5  # Window size for Savitzky-Golay smoothing (must be odd)
  savgol_filter_order: 2   # Polynomial order for smoothing

# Robot control
robot:
  arm_control_hz: 100
  gripper_control_hz: 10
  approach_height: 0.15
  grasp_height: 0.0
  transport_height: 0.15
  release_height: 0.0

# Logging & visualization
logging_level: INFO
tensorboard_log_dir: outputs/logs
visualize_predictions: false
